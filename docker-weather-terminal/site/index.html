<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Терминал: Docker Симулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-window">
        <div class="terminal-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">zveig@MyNewLaptop: ~/weather_docker</span>
        </div>
        <div class="terminal-body" id="terminal-output">
            <div>Добро пожаловать в симулятор Docker на WSL2!</div>
            <div>Здесь всё работает идеально с первого раза (в отличие от реальности).</div>
            <div>Введи <span style="color:#89d185">help</span>, чтобы увидеть доступные команды.</div>
            <br>
        </div>
        <div class="terminal-input-line">
            <span style="color: #27c93f;">zveig@MyNewLaptop</span>:<span style="color: #569cd6;">~/weather_docker</span>$&nbsp;
            <input type="text" id="terminal-input" autocomplete="off" autofocus>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
