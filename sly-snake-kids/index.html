<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Хитрый Змей Дми 3 (Mobile)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0b0f14; color: #e6edf3; font-family: system-ui, sans-serif;
      overflow: hidden; touch-action: none;
    }
    h1 { margin: 10px 0 4px; font-size: 24px; }
    .hud { margin-bottom: 8px; font-size: 16px; text-align: center; }
    .hud .name { color: #2ecc71; font-weight: 600; }
    .hud .best { color: #f1c40f; }
    
    .canvas-wrapper { position: relative; display: flex; justify-content: center; align-items: center; }

    canvas {
      border: 2px solid #30363d; border-radius: 8px; background: #111;
      box-shadow: 0 0 30px rgba(46, 204, 113, 0.15);
      max-width: 95vw; max-height: 65vh; 
      pointer-events: auto; /* Холст принимает клики */
    }
    
    p { margin-top: 10px; color: #8b949e; font-size: 13px; text-align: center; line-height: 1.4; }

    .screen {
      position: fixed; inset: 0; background: rgba(11, 15, 20, 0.97);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .screen.hidden { display: none; }
    .screen h2 { margin: 0 0 16px; font-size: 24px; }
    .screen input {
      background: #161b22; border: 2px solid #30363d; color: #e6edf3;
      padding: 12px 16px; border-radius: 8px; font-size: 18px;
      width: 260px; text-align: center; outline: none; margin-bottom: 12px;
    }
    .screen input:focus { border-color: #2ecc71; }
    
    .buttons-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .screen button {
      color: #0b0f14; border: none; padding: 12px 24px; border-radius: 8px;
      font-size: 16px; font-weight: 700; cursor: pointer; transition: background .15s;
    }
    .btn-play { background: #2ecc71; }
    .btn-play:hover { background: #27ae60; }
    .btn-train { background: #f1c40f; }
    .btn-train:hover { background: #d4ac0d; }
    .screen button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

    .leaderboard { margin-top: 10px; width: 340px; max-width: 100%; }
    .leaderboard h3 { margin: 0 0 8px; font-size: 15px; color: #8b949e; text-transform: uppercase; text-align: center; }
    .leaderboard table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .leaderboard th, .leaderboard td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #21262d; }
    .leaderboard th { color: #8b949e; font-weight: 500; font-size: 12px; }
    .leaderboard td.rank { color: #f1c40f; font-weight: 700; width: 28px; }
    .leaderboard td.name { color: #2ecc71; }
    .leaderboard tr.current td { background: rgba(46, 204, 113, 0.08); }
    .leaderboard .empty { text-align: center; color: #484f58; font-style: italic; }

    /* --- Кнопка паузы (Фикс) --- */
    #pause-btn {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(48, 54, 61, 0.9);
      color: #e6edf3; border: 1px solid #8b949e;
      border-radius: 5px; padding: 5px 10px; font-size: 20px;
      cursor: pointer;
      z-index: 100; /* Выше холста */
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent; /* Убираем синюю рамку на мобилках */
    }
    #pause-btn:hover { background: rgba(139, 148, 158, 0.5); }

    #pause-menu {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #161b22; border: 2px solid #30363d; padding: 20px; border-radius: 12px;
      display: flex; flex-direction: column; gap: 10px;
      z-index: 500; /* Меню выше всего */
      box-shadow: 0 0 20px rgba(0,0,0,0.8); text-align: center;
    }
    #pause-menu.hidden { display: none; }
    #pause-menu h3 { margin-bottom: 10px; color: #f1c40f; }
    #pause-menu button {
      padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold;
    }
    #btn-resume { background: #2ecc71; color: #0b0f14; }
    #btn-restart { background: #f1c40f; color: #0b0f14; }
    #btn-quit { background: #e74c3c; color: #fff; }

    #restart-btn {
      position: absolute; top: 65%; left: 50%; transform: translate(-50%, -50%);
      background: #2ecc71; color: #0b0f14; border: 2px solid #fff;
      padding: 15px 30px; border-radius: 8px; font-size: 20px; font-weight: bold;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 100;
    }
    #restart-btn:hover { background: #27ae60; }
    #restart-btn.hidden { display: none; }
  </style>
</head>
<body>
  <h1>Хитрый Змей Дми 3</h1>

  <div class="hud">
    <span class="name" id="playerDisplay">—</span> ·
    Счёт: <span id="score">0</span> ·
    Уровень: <span id="level">1</span> ·
    Яблок: <span id="apples">0</span> ·
    Рекорд: <span class="best" id="bestScore">0</span>
  </div>

  <div class="canvas-wrapper">
    <canvas id="game" width="480" height="480"></canvas>
    
    <button id="pause-btn" class="hidden">⏸</button>
    <div id="pause-menu" class="hidden">
      <h3>Пауза</h3>
      <button id="btn-resume">Продолжить</button>
      <button id="btn-restart">Заново</button>
      <button id="btn-quit">Выйти в меню</button>
    </div>
    <button id="restart-btn" class="hidden">Играть снова</button>
  </div>

  <p>
    Управление: свайпы по экрану (на телефоне) или стрелки / WASD (на ПК).<br>
    Пробел — пауза. R — заново. P — сменить игрока.
  </p>

  <div class="screen" id="nameScreen">
    <h2>🐍 Как тебя зовут?</h2>
    <input id="playerInput" maxlength="16" placeholder="Игрок" autocomplete="off">
    <div class="buttons-row">
      <button id="startBtn" class="btn-play" disabled>Играть</button>
      <button id="trainBtn" class="btn-train" disabled>Тренировка 🐢</button>
    </div>
    <div class="leaderboard" id="leaderboard"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
