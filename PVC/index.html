<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Plants vs Cactus | Оборона сада</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { min-height: 100vh; background: linear-gradient(135deg, #1a472a 0%, #0d2818 100%); display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', 'Courier New', monospace; cursor: crosshair; padding: 16px; }
        .game-wrapper { width: 100%; max-width: 1400px; margin: 0 auto; }
        .game-container { background: linear-gradient(145deg, #4a3520, #2a1a0a); padding: clamp(8px, 2vw, 24px); border-radius: clamp(16px, 4vw, 40px); box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.1); border: 1px solid rgba(255,200,100,0.3); position: relative; }
        canvas { display: block; margin: 0 auto; border-radius: clamp(12px, 3vw, 24px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); cursor: crosshair; background: radial-gradient(circle at 20% 30%, #4a7c3f, #2a5a2a); width: 100%; height: auto; aspect-ratio: 900 / 550; }
        .ui-panel { margin-top: clamp(12px, 3vw, 20px); display: flex; justify-content: space-between; align-items: center; gap: clamp(10px, 2vw, 20px); flex-wrap: wrap; background: rgba(0,0,0,0.6); padding: clamp(8px, 2vw, 14px) clamp(16px, 3vw, 28px); border-radius: 60px; backdrop-filter: blur(8px); }
        .stats { display: flex; gap: clamp(10px, 2vw, 25px); flex-wrap: wrap; }
        .score-box, .health-box, .wave-box { background: linear-gradient(145deg, #1a1a1a, #0a0a0a); padding: clamp(6px, 1.5vw, 10px) clamp(16px, 3vw, 28px); border-radius: 60px; color: #ffd966; font-weight: bold; font-size: clamp(18px, 5vw, 28px); text-shadow: 0 0 5px #ff6600; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 8px; }
        .score-box span, .health-box span, .wave-box span { color: #aaa; font-size: clamp(12px, 3vw, 16px); }
        button { background: linear-gradient(145deg, #ffaa33, #ff8800); border: none; padding: clamp(8px, 2vw, 12px) clamp(20px, 4vw, 35px); border-radius: 60px; font-weight: bold; font-size: clamp(16px, 4vw, 20px); cursor: pointer; transition: all 0.2s ease; color: #2a1a0a; font-family: inherit; box-shadow: 0 4px 0 #8b5a2b; display: flex; align-items: center; gap: 8px; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #8b5a2b; }
        .pause-btn { background: linear-gradient(145deg, #3a6a8a, #2a4a6a); box-shadow: 0 4px 0 #1a3a5a; }
        .controls { background: rgba(0,0,0,0.5); padding: clamp(6px, 1.5vw, 10px) clamp(12px, 2vw, 20px); border-radius: 60px; color: #cccc88; font-size: clamp(11px, 3vw, 14px); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        @media (hover: none) { body { cursor: default; } canvas { cursor: pointer; } .controls .desktop-only { display: none; } }
        @media (max-width: 640px) { body { padding: 8px; } .ui-panel { flex-direction: column; border-radius: 28px; } .stats { justify-content: center; } .controls { justify-content: center; text-align: center; } }
        .mobile-only { display: none; }
        @media (max-width: 768px) { .mobile-only { display: inline; } .desktop-only { display: none; } }
        .game-over-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; border-radius: clamp(12px, 3vw, 24px); z-index: 20; flex-direction: column; gap: 20px; }
        .game-over-screen h1 { color: #ff4444; font-size: 48px; text-shadow: 0 0 10px #ff0000; }
        .game-over-screen p { color: #ffaa44; font-size: 24px; }
        .game-over-screen button { font-size: 20px; padding: 12px 30px; }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-container" id="gameContainer" style="position: relative;">
        <canvas id="gameCanvas" width="900" height="550"></canvas>
        <div class="ui-panel">
            <div class="stats">
                <div class="score-box"><span>🌵</span><span class="value" id="scoreValue">0</span></div>
                <div class="health-box"><span>❤️</span><span class="value" id="healthValue">5</span></div>
                <div class="wave-box"><span>🌊</span><span class="value" id="waveValue">1</span></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="pauseBtn" class="pause-btn"><span>⏸️</span> Пауза</button>
                <button id="resetBtn"><span>🔄</span> Новая игра</button>
            </div>
            <div class="controls"><span>🎯 <span class="desktop-only">мышка — прицел</span><span class="mobile-only">палец — наводка</span></span><span>🔫 <span class="desktop-only">клик — выстрел</span><span class="mobile-only">тап — выстрел</span></span></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const CANVAS_W = 900, CANVAS_H = 550;
    
    let score = 0, health = 5, wave = 1, gameRunning = true, isPaused = false;
    let particles = [], enemies = [];
    let mouseX = CANVAS_W/2, mouseY = CANVAS_H/2;
    let shootSound, hitSound, loseSound;
    let bestScore = localStorage.getItem('cactusBest') || 0;
    
    let enemiesToSpawn = 5, enemiesSpawned = 0, spawnCooldown = 0, waveInProgress = true, nextWaveDelay = 0;
    let hitFlash = 0, shakeAmount = 0, plantShootAnim = 0;
    let gameOverFlash = 0;
    
    // Позиция растения (игрока)
    const plantX = 70, plantY = CANVAS_H - 60;
    const plantRadius = 30;
    
    let plantImg = new Image();
    plantImg.src = 'assets/images/player.png';
    
    function updateUI() {
        document.getElementById('scoreValue').innerText = score;
        document.getElementById('healthValue').innerText = health;
        document.getElementById('waveValue').innerText = wave;
        if(score > bestScore) { bestScore = score; localStorage.setItem('cactusBest', bestScore); }
    }
    
    function playSound(sound) { if(sound && sound.play && !isPaused) { try { sound.currentTime = 0; sound.play().catch(e=>{}); } catch(e){} } }
    
    function addExplosion(x,y) {
        for(let i=0;i<12;i++) particles.push({x,y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6-2, life:0.8, size:Math.random()*5+3, color:`hsl(${Math.random()*40+20},80%,55%)`});
    }
    
    function addBloodEffect(x,y) {
        for(let i=0;i<15;i++) particles.push({x,y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8-3, life:0.6, size:Math.random()*6+2, color:`hsl(0,80%,${Math.random()*30+40}%)`});
    }
    
    class Cactus {
        constructor(x,y,type,hp) {
            this.x=x; this.y=y; this.type=type; this.hp=hp; this.maxHp=hp;
            this.size = type==='big'?45:(type==='medium'?35:25);
            this.speedX=(Math.random()-0.5)*0.9;
            this.speedY=(Math.random()-0.5)*0.6;
            this.angle = Math.random()*Math.PI*2;
            this.spikeAngle = 0;
        }
        update() {
            if(isPaused) return;
            this.x += this.speedX;
            this.y += this.speedY;
            this.angle += 0.03;
            this.spikeAngle += 0.05;
            this.x = Math.min(Math.max(this.x, this.size/2+15), CANVAS_W - this.size/2-15);
            this.y = Math.min(Math.max(this.y, this.size/2+40), CANVAS_H - this.size/2-20);
        }
        draw(ctx) {
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            const grad = ctx.createLinearGradient(this.x-10, this.y-10, this.x+10, this.y+10);
            grad.addColorStop(0, '#2a5a1a');
            grad.addColorStop(1, '#1a3a0a');
            ctx.fillStyle = grad;
            
            if(this.type === 'big') {
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, 22, 30, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#1a4a0a';
                ctx.beginPath();
                ctx.ellipse(this.x-6, this.y-10, 8, 14, -0.2, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(this.x+6, this.y-8, 7, 12, 0.2, 0, Math.PI*2);
                ctx.fill();
                for(let i=0;i<12;i++) {
                    let a = this.spikeAngle + i * Math.PI*2/12;
                    let sx = this.x + Math.cos(a) * 26;
                    let sy = this.y + Math.sin(a) * 28;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + Math.cos(a)*12, sy + Math.sin(a)*10);
                    ctx.lineTo(sx + Math.cos(a+0.5)*7, sy + Math.sin(a+0.5)*7);
                    ctx.fillStyle = '#8B5A2B';
                    ctx.fill();
                }
            } else if(this.type === 'medium') {
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, 18, 25, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#1a4a0a';
                ctx.beginPath();
                ctx.ellipse(this.x-5, this.y-6, 6, 10, -0.1, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(this.x+4, this.y-5, 5, 9, 0.1, 0, Math.PI*2);
                ctx.fill();
                for(let i=0;i<8;i++) {
                    let a = this.spikeAngle + i * Math.PI*2/8;
                    let sx = this.x + Math.cos(a) * 22;
                    let sy = this.y + Math.sin(a) * 23;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + Math.cos(a)*10, sy + Math.sin(a)*8);
                    ctx.lineTo(sx + Math.cos(a+0.5)*6, sy + Math.sin(a+0.5)*6);
                    ctx.fillStyle = '#8B5A2B';
                    ctx.fill();
                }
            } else {
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, 13, 19, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#1a4a0a';
                ctx.beginPath();
                ctx.ellipse(this.x-3, this.y-4, 4, 7, -0.1, 0, Math.PI*2);
                ctx.fill();
                for(let i=0;i<6;i++) {
                    let a = this.spikeAngle + i * Math.PI*2/6;
                    let sx = this.x + Math.cos(a) * 17;
                    let sy = this.y + Math.sin(a) * 18;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + Math.cos(a)*8, sy + Math.sin(a)*7);
                    ctx.lineTo(sx + Math.cos(a+0.5)*5, sy + Math.sin(a+0.5)*5);
                    ctx.fillStyle = '#8B5A2B';
                    ctx.fill();
                }
            }
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.ellipse(this.x-7, this.y-5, 5, 6, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(this.x+7, this.y-5, 5, 6, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(this.x-9, this.y-7, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.x+5, this.y-7, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(this.x-14, this.y-14);
            ctx.lineTo(this.x-4, this.y-12);
            ctx.lineTo(this.x-6, this.y-9);
            ctx.fillStyle = '#1a0a00';
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(this.x+14, this.y-14);
            ctx.lineTo(this.x+4, this.y-12);
            ctx.lineTo(this.x+6, this.y-9);
            ctx.fill();
            
            const hpPercent = this.hp / this.maxHp;
            ctx.fillStyle = '#aa3333';
            ctx.fillRect(this.x-18, this.y-24, 36, 6);
            ctx.fillStyle = '#44aa44';
            ctx.fillRect(this.x-18, this.y-24, 36 * hpPercent, 6);
            
            ctx.beginPath();
            ctx.arc(this.x, this.y+5, 10, 0.1, Math.PI - 0.1);
            ctx.strokeStyle = '#5a3a1a';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#ffeeaa';
            ctx.beginPath();
            ctx.rect(this.x-5, this.y+2, 4, 5);
            ctx.fill();
            ctx.beginPath();
            ctx.rect(this.x+1, this.y+2, 4, 5);
            ctx.fill();
        }
        hit(damage) { this.hp -= damage; return this.hp <= 0; }
    }
    
    function spawnEnemy() {
        let types = ['small','medium','big'];
        let hpMap = {small:1, medium:2, big:3};
        let typeIndex = Math.min(Math.floor(Math.random() * (wave/2 + 1)), 2);
        let type = types[typeIndex];
        let hp = hpMap[type] + Math.floor(wave / 5);
        let x = Math.random() * (CANVAS_W - 100) + 50;
        let y = Math.random() * (CANVAS_H - 120) + 60;
        enemies.push(new Cactus(x,y,type,hp));
    }
    
    function startWave() { waveInProgress = true; enemiesToSpawn = 5 + wave * 2; enemiesSpawned = 0; spawnCooldown = 0; }
    
    function gameOver() {
        gameRunning = false;
        isPaused = false;
        playSound(loseSound);
        gameOverFlash = 30;
        updateUI();
    }
    
    function resetGame() { 
        gameRunning = true; 
        isPaused = false; 
        score = 0; 
        health = 5; 
        wave = 1; 
        enemies = []; 
        particles = []; 
        updateUI(); 
        startWave(); 
        hitFlash = 0; 
        shakeAmount = 0; 
        gameOverFlash = 0;
        document.getElementById('pauseBtn').innerHTML = '<span>⏸️</span> Пауза'; 
    }
    
    function togglePause() { if(!gameRunning) return; isPaused = !isPaused; document.getElementById('pauseBtn').innerHTML = isPaused ? '<span>▶️</span> Продолжить' : '<span>⏸️</span> Пауза'; }
    
    function checkCollisions() {
        // Проверка касания кактуса с игроком (растением)
        for(let i=0; i<enemies.length; i++) {
            const e = enemies[i];
            const dx = e.x - plantX;
            const dy = e.y - plantY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < e.size/2 + plantRadius) {
                // Кактус коснулся игрока!
                addBloodEffect(e.x, e.y);
                enemies.splice(i,1);
                health--;
                updateUI();
                shakeAmount = 15;
                hitFlash = 20;
                if(health <= 0) {
                    gameOver();
                    break;
                }
                i--;
            }
        }
        
        // Также проверка на центр (старый механизм)
        for(let i=0; i<enemies.length; i++) {
            const e = enemies[i];
            const centerX = CANVAS_W/2;
            const centerY = CANVAS_H/2;
            const dx = e.x - centerX;
            const dy = e.y - centerY;
            if(Math.sqrt(dx*dx + dy*dy) < 55) {
                enemies.splice(i,1);
                health--;
                updateUI();
                shakeAmount = 12;
                hitFlash = 15;
                i--;
                if(health <= 0) gameOver();
            }
        }
    }
    
    function shootAt(targetX, targetY) {
        if(!gameRunning || isPaused) return;
        plantShootAnim = 8;
        let closest = null, minDist = 50;
        for(let e of enemies) { let dx = e.x - targetX, dy = e.y - targetY, dist = Math.sqrt(dx*dx+dy*dy); if(dist < minDist) { minDist = dist; closest = e; } }
        if(closest) {
            playSound(hitSound);
            let isDead = closest.hit(1);
            addExplosion(closest.x, closest.y);
            hitFlash = 8;
            if(isDead) { let idx = enemies.indexOf(closest); if(idx !== -1) enemies.splice(idx,1); let points = closest.type==='big'?30:(closest.type==='medium'?20:10); score += points; updateUI(); if(enemies.length===0 && waveInProgress && enemiesSpawned>=enemiesToSpawn) { waveInProgress = false; nextWaveDelay = 40; } }
            else { shakeAmount = 3; }
        }
    }
    
    function updateWave() { if(!gameRunning || isPaused) return;
        if(waveInProgress) { if(spawnCooldown<=0 && enemiesSpawned<enemiesToSpawn) { spawnEnemy(); enemiesSpawned++; spawnCooldown=20; } else if(spawnCooldown>0) spawnCooldown--; }
        else if(nextWaveDelay>0) { nextWaveDelay--; if(nextWaveDelay===0) { wave++; updateUI(); startWave(); } }
    }
    
    function updateEnemies() { if(isPaused) return;
        checkCollisions(); // Проверка касаний с игроком
        
        if(shakeAmount>0) { shakeAmount--; document.getElementById('gameContainer').style.transform=`translate(${Math.random()*shakeAmount-shakeAmount/2}px,${Math.random()*shakeAmount/2}px)`; }
        else { document.getElementById('gameContainer').style.transform='translate(0,0)'; }
        
        if(hitFlash>0) { hitFlash--; canvas.style.filter=`brightness(${1+hitFlash/30})`; } else canvas.style.filter='brightness(1)';
    }
    
    function updateParticles() { 
        for(let i=0;i<particles.length;i++) { 
            particles[i].x+=particles[i].vx; 
            particles[i].y+=particles[i].vy; 
            particles[i].vy+=0.15; 
            particles[i].life-=0.02; 
            if(particles[i].life<=0 || particles[i].y>CANVAS_H+50) { 
                particles.splice(i,1); 
                i--; 
            } 
        } 
        if(plantShootAnim>0) plantShootAnim--;
        if(gameOverFlash>0) gameOverFlash--;
    }
    
    function drawBackground() {
        ctx.fillStyle='#6a9a4a'; ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
        for(let i=0;i<100;i++) { ctx.fillStyle=`rgba(50,80,30,${Math.random()*0.3})`; ctx.beginPath(); ctx.moveTo(Math.random()*CANVAS_W,CANVAS_H); ctx.lineTo(Math.random()*CANVAS_W,CANVAS_H-Math.random()*30); ctx.lineTo(Math.random()*CANVAS_W,CANVAS_H); ctx.fill(); }
        ctx.fillStyle='rgba(255,255,200,0.6)';
        ctx.beginPath(); ctx.ellipse(120,60,45,35,0,0,Math.PI*2); ctx.ellipse(170,40,40,30,0,0,Math.PI*2); ctx.ellipse(70,45,40,32,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(700,80,55,40,0,0,Math.PI*2); ctx.ellipse(760,60,45,35,0,0,Math.PI*2); ctx.ellipse(650,70,45,35,0,0,Math.PI*2); ctx.fill();
    }
    
    function drawPlant() {
        if(plantShootAnim>0) { ctx.beginPath(); ctx.arc(plantX+15,plantY-10,25,0,Math.PI*2); ctx.fillStyle=`rgba(255,255,100,${0.3+plantShootAnim/15})`; ctx.fill(); }
        if(plantImg.complete && plantImg.naturalWidth>0) { let scale = plantShootAnim>0?1.1:1; ctx.drawImage(plantImg, plantX-25*scale, plantY-25*scale, 50*scale, 50*scale); }
        else { ctx.fillStyle='#4a9a2a'; ctx.beginPath(); ctx.ellipse(plantX,plantY,25,30,0,0,Math.PI*2); ctx.fill(); }
        ctx.font='bold 12px monospace'; ctx.fillStyle='#ffeeaa'; ctx.shadowBlur=2; ctx.fillText('⚔️ ЗАЩИТНИК ⚔️', plantX-35, plantY-35); ctx.shadowBlur=0;
        
        // Красная вспышка при получении урона
        if(hitFlash>0 && hitFlash>10) {
            ctx.fillStyle='rgba(255,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(plantX,plantY,40,40,0,0,Math.PI*2);
            ctx.fill();
        }
    }
    
    function drawCrosshair() {
        if(!gameRunning) return;
        ctx.beginPath(); ctx.moveTo(mouseX-15,mouseY); ctx.lineTo(mouseX-7,mouseY); ctx.moveTo(mouseX+7,mouseY); ctx.lineTo(mouseX+15,mouseY);
        ctx.moveTo(mouseX,mouseY-15); ctx.lineTo(mouseX,mouseY-7); ctx.moveTo(mouseX,mouseY+7); ctx.lineTo(mouseX,mouseY+15);
        ctx.lineWidth=2; ctx.strokeStyle='white'; ctx.stroke();
        ctx.beginPath(); ctx.arc(mouseX,mouseY,12,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(mouseX,mouseY,6,0,Math.PI*2); ctx.stroke();
    }
    
    function drawParticles() { for(let p of particles) { ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); } }
    
    function drawUIonCanvas() {
        ctx.font='bold 24px "Segoe UI", monospace'; ctx.fillStyle='#ffeeaa'; ctx.shadowBlur=4; ctx.fillText(`ЛУЧШИЙ: ${bestScore}`, CANVAS_W-170,45); ctx.shadowBlur=0;
        
        if(!gameRunning) {
            ctx.fillStyle='rgba(0,0,0,0.7)';
            ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
            ctx.font='bold 42px monospace';
            ctx.fillStyle='#ff4444';
            ctx.shadowBlur=8;
            ctx.fillText('💀 GAME OVER 💀', CANVAS_W/2-160, CANVAS_H/2-40);
            ctx.font='20px monospace';
            ctx.fillStyle='#ffaa44';
            ctx.fillText(`СЧЁТ: ${score}  |  ЛУЧШИЙ: ${bestScore}`, CANVAS_W/2-150, CANVAS_H/2+20);
            ctx.font='16px monospace';
            ctx.fillStyle='#cccc88';
            ctx.fillText('НАЖМИТЕ "НОВАЯ ИГРА"', CANVAS_W/2-120, CANVAS_H/2+70);
            ctx.shadowBlur=0;
        }
        
        if(isPaused && gameRunning) {
            ctx.fillStyle='rgba(0,0,0,0.5)';
            ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
            ctx.font='bold 36px monospace';
            ctx.fillStyle='#ffaa44';
            ctx.fillText('⏸ ПАУЗА ⏸', CANVAS_W/2-100, CANVAS_H/2);
        }
        
        if(gameOverFlash>0) {
            ctx.fillStyle=`rgba(255,0,0,${gameOverFlash/30})`;
            ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
        }
    }
    
    function gameLoop() {
        if(gameRunning && !isPaused) { updateWave(); updateEnemies(); updateParticles(); } else { updateParticles(); }
        drawBackground();
        for(let enemy of enemies) enemy.draw(ctx);
        drawParticles();
        drawPlant();
        drawCrosshair();
        drawUIonCanvas();
        requestAnimationFrame(gameLoop);
    }
    
    function init() {
        updateUI(); resetGame();
        try { 
            const AudioContext = window.AudioContext||window.webkitAudioContext; 
            const audioCtx=new AudioContext(); 
            function createBeep(freq,dur,vol){const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.value=freq; gain.gain.value=vol; osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001,audioCtx.currentTime+dur); osc.stop(audioCtx.currentTime+dur);} 
            shootSound={play:()=>createBeep(880,0.15,0.1)}; 
            hitSound={play:()=>createBeep(440,0.25,0.12)};
            loseSound={play:()=>createBeep(220,0.8,0.15)};
        } catch(e){shootSound={play:()=>{}}; hitSound={play:()=>{}}; loseSound={play:()=>{}};}
        
        function getCanvasCoords(e){const rect=canvas.getBoundingClientRect(); const scaleX=CANVAS_W/rect.width; const scaleY=CANVAS_H/rect.height; let clientX,clientY; if(e.touches){clientX=e.touches[0].clientX; clientY=e.touches[0].clientY; e.preventDefault();}else{clientX=e.clientX; clientY=e.clientY;} let canvasX=(clientX-rect.left)*scaleX; let canvasY=(clientY-rect.top)*scaleY; canvasX=Math.min(Math.max(canvasX,0),CANVAS_W); canvasY=Math.min(Math.max(canvasY,0),CANVAS_H); return{x:canvasX,y:canvasY};}
        
        canvas.addEventListener('mousemove',(e)=>{let c=getCanvasCoords(e); mouseX=c.x; mouseY=c.y;});
        canvas.addEventListener('click',(e)=>{if(isPaused || !gameRunning) return; let c=getCanvasCoords(e); shootAt(c.x,c.y); playSound(shootSound);});
        canvas.addEventListener('touchmove',(e)=>{e.preventDefault(); let c=getCanvasCoords(e); mouseX=c.x; mouseY=c.y;});
        canvas.addEventListener('touchstart',(e)=>{e.preventDefault(); if(isPaused || !gameRunning) return; let c=getCanvasCoords(e); mouseX=c.x; mouseY=c.y; shootAt(c.x,c.y); playSound(shootSound);});
        document.getElementById('resetBtn').addEventListener('click',()=>resetGame());
        document.getElementById('pauseBtn').addEventListener('click',()=>togglePause());
        gameLoop();
    }
    init();
</script>
</body>
</html>
